name: Publish signed Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed draft tag matching package.json (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Nancyingcode/token-usage'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      APP_RELEASE_TAG: ${{ inputs.tag }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin and validate release commit
        run: |
          git remote set-url origin git@github.com:Nancyingcode/token-usage.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseCommit = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tagCommit = git rev-parse --verify "refs/tags/$($env:APP_RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($releaseCommit -ne $tagCommit) { throw 'Checkout does not match the exact release tag.' }
          $env:APP_RELEASE_COMMIT = $releaseCommit
          "APP_RELEASE_COMMIT=$releaseCommit" >> $env:GITHUB_ENV
          node scripts/release-publish.cjs --validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify and publish the existing signed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-publish.cjs
